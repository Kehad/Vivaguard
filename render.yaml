services:
  - type: web
    name: vivaguard-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://your-backend-url.onrender.com # Update with your live backend URL on Render
      - key: NEXT_PUBLIC_WS_URL
        value: wss://your-backend-url.onrender.com/ws/copilot # Update with your live WebSocket URL on Render
